[build]
  command = "node scripts/prepare-site.mjs"
  publish = "dist"

[build.environment]
  # This unused legacy setting contains public site text, not a provider key.
  # AI uses separately managed OpenAI credentials; retain all other secret scans.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.{jpg,jpeg,png,webp,avif}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
